<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Top Coin Alpha</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
        body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;padding:15px}
        .container{max-width:1200px;margin:0 auto}
        h1{text-align:center;margin-bottom:6px;font-size:1.6rem;background:linear-gradient(90deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{text-align:center;color:#aaa;margin-bottom:16px;font-size:.85rem}
        .admin-list-title{margin:22px 0 12px;font-size:1.15rem;color:#00d2ff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
        .login-box{max-width:400px;margin:80px auto;background:rgba(255,255,255,.08);padding:30px;border-radius:16px;text-align:center;border:1px solid rgba(255,255,255,.1)}
        .login-box input,.form-row input,.form-row select,.note-wrap textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.3);color:#fff;font-size:.95rem}
        .login-box input{margin:12px 0}
        .login-box button,.save-btn,.cancel-btn,.refresh-btn{padding:12px;border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer}
        .login-box button,.save-btn{width:100%;background:linear-gradient(90deg,#00d2ff,#3a7bd5);margin-top:14px}
        .cancel-btn{width:100%;background:#555;margin-top:8px;display:none}
        .refresh-btn{background:#00c853;padding:8px 14px;font-size:.85rem}
        .form-card{background:rgba(255,255,255,.07);border-radius:14px;padding:20px;border:1px solid rgba(255,255,255,.1)}
        .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
        .form-row label,.note-wrap label{display:block;font-size:.78rem;color:#aaa;margin-bottom:4px}
        .note-wrap{margin-top:14px}
        .note-wrap textarea{min-height:110px;resize:vertical;font-family:inherit}
        .hist-board{margin-top:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 18px}
        .hist-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
        .hist-head h2{font-size:1.1rem;color:#00d2ff}
        .hist-tabs,.filter-bar{display:flex;gap:6px;flex-wrap:wrap}
        .hist-tabs button,.filter-bar button{background:rgba(255,255,255,.1);border:none;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.8rem}
        .hist-tabs button.active,.filter-bar button.active{background:linear-gradient(90deg,#00d2ff,#3a7bd5)}
        .filter-bar{margin:0 0 12px}
        .hist-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
        .hist-item{background:rgba(0,0,0,.28);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-left:4px solid #00ff88}
        .hist-item.sl{border-left-color:#ff5252}
        .hist-item.dca{border-left-color:#ffd54f}
        .hist-item .coin{font-weight:700;color:#00d2ff}
        .hist-item .kind-tp{color:#00ff88;font-weight:700}
        .hist-item .kind-sl{color:#ff8a80;font-weight:700}
        .hist-item .kind-dca{color:#ffd54f;font-weight:700}
        .hist-item .when{font-size:.78rem;color:#aaa}
        .hist-empty{text-align:center;color:#888;padding:16px 8px}
        .coin-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
        .coin-card{background:rgba(255,255,255,.07);border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,.1)}
        .coin-card.has-hit{border-color:#00ff88}
        .coin-card.has-sl{border-color:#ff5252}
        .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
        .coin-name{font-size:1.2rem;font-weight:700;color:#00d2ff}
        .side-badge,.wave-badge{padding:3px 10px;border-radius:12px;font-size:.72rem;font-weight:600}
        .side-long{background:rgba(0,255,136,.2);color:#00ff88}
        .side-short{background:rgba(255,82,82,.2);color:#ff5252}
        .wave-badge{background:rgba(0,210,255,.18);color:#7ad7ff}
        .time{font-size:.75rem;color:#aaa}
        .prices-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
        .price-box{background:rgba(0,0,0,.25);border-radius:8px;padding:7px 9px}
        .price-box .label{font-size:.68rem;color:#999;margin-bottom:2px}
        .price-box .value{font-size:.92rem;font-weight:600}
        .sl-price{color:#ff8a80}
        .dca-price{color:#ffd54f}
        .tp-status{display:flex;gap:6px;flex-wrap:wrap}
        .tp-badge{padding:4px 11px;border-radius:12px;font-size:.75rem;font-weight:600;background:rgba(255,255,255,.08);color:#bbb;border:none;cursor:pointer}
        .tp-badge.hit{background:rgba(0,255,136,.25);color:#00ff88}
        .tp-badge.sl-hit{background:rgba(255,82,82,.28);color:#ff5252}
        .tp-badge.dca-hit{background:rgba(255,213,79,.25);color:#ffd54f}
        .note-box{margin-top:10px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 10px}
        .note-label{font-size:.68rem;color:#999;margin-bottom:4px}
        .note-text{font-size:.82rem;color:#ddd;line-height:1.45}
        .admin-actions{display:flex;gap:8px;margin-top:10px}
        .admin-actions button{flex:1;padding:8px;border:none;border-radius:8px;color:#fff;font-weight:600;cursor:pointer}
        .btn-edit{background:#3a7bd5}
        .btn-del{background:#ff5252}
        .empty{text-align:center;padding:40px;color:#666;grid-column:1/-1}
        .loading{text-align:center;color:#00d2ff;margin:8px 0;font-size:.85rem;display:none}
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <h2>🔒 Admin</h2>
        <p style="color:#aaa;margin-bottom:15px;">Nhập mật khẩu để thêm nhận định</p>
        <input type="password" id="password" placeholder="Mật khẩu..." onkeypress="if(event.key==='Enter') checkPassword()">
        <button onclick="checkPassword()">Vào</button>
        <p id="error" style="color:#ff5252;margin-top:10px;display:none;">Sai mật khẩu!</p>
    </div>
    <div class="container" id="adminContent" style="display:none;">
        <h1 id="formTitle">📥 Thêm Nhận định</h1>
        <p class="subtitle">Chỉ tính đỉnh/đáy từ lúc nhập lệnh. Bấm badge để tích tay khi cần.</p>
        <div class="form-card">
            <div class="form-row">
                <div><label>COIN</label><input type="text" id="coin" placeholder="BTC"></div>
                <div><label>Giá vào lệnh</label><input type="number" id="entry" placeholder="65000" step="any"></div>
                <div><label>DCA / Giá mua thêm</label><input type="number" id="dca" placeholder="63000" step="any"></div>
                <div><label>Stoploss</label><input type="number" id="sl" placeholder="64000" step="any"></div>
                <div><label>TP1</label><input type="number" id="tp1" placeholder="66000" step="any"></div>
                <div><label>TP2</label><input type="number" id="tp2" placeholder="67500" step="any"></div>
                <div><label>TP3</label><input type="number" id="tp3" placeholder="69000" step="any"></div>
                <div><label>Hướng</label>
                    <select id="side"><option value="LONG">LONG 📈</option><option value="SHORT">SHORT 📉</option></select>
                </div>
                <div><label>Chọn sóng</label>
                    <select id="wave">
                        <option value="">-- Chọn sóng --</option>
                        <option value="Sóng hồi">Sóng hồi</option>
                        <option value="Sóng FOMO">Sóng FOMO</option>
                        <option value="Sóng dump">Sóng dump</option>
                        <option value="Sóng breakout">Sóng breakout</option>
                        <option value="Sóng tích lũy">Sóng tích lũy</option>
                        <option value="Sóng nến">Sóng nến</option>
                        <option value="Mới list">Mới list</option>
                    </select>
                </div>
            </div>
            <div class="note-wrap"><label>Note / Phân tích</label><textarea id="note" placeholder="Viết phân tích của bạn vào đây..."></textarea></div>
            <button class="save-btn" id="saveBtn" onclick="saveCoin()">+ Lưu nhận định</button>
            <button class="cancel-btn" id="cancelBtn" onclick="cancelEdit()">Hủy sửa</button>
        </div>
        <div class="hist-board">
            <div class="hist-head">
                <h2>Lịch sử dính TP / SL / DCA</h2>
                <div class="hist-tabs">
                    <button class="active" onclick="setLogFilter('today')">Hôm nay</button>
                    <button onclick="setLogFilter('all')">Tất cả</button>
                    <button onclick="setLogFilter('tp')">Chỉ TP</button>
                    <button onclick="setLogFilter('sl')">Chỉ SL</button>
                    <button onclick="setLogFilter('dca')">Chỉ DCA</button>
                </div>
            </div>
            <div class="hist-list" id="histList"></div>
        </div>
        <div class="admin-list-title">
            <span>Quản lý tất cả nhận định</span>
            <button class="refresh-btn" onclick="updateAllPrices()">🔄 Kiểm tra dính</button>
        </div>
        <div class="filter-bar">
            <button class="active" onclick="setCoinFilter('all')">Tất cả</button>
            <button onclick="setCoinFilter('tp1')">Dính TP1</button>
            <button onclick="setCoinFilter('tp2')">Dính TP2</button>
            <button onclick="setCoinFilter('tp3')">Dính TP3</button>
            <button onclick="setCoinFilter('sl')">Dính SL</button>
            <button onclick="setCoinFilter('dca')">Dính DCA</button>
            <button onclick="setCoinFilter('pending')">Chưa dính</button>
        </div>
        <div id="loading" class="loading">Đang kiểm tra giá...</div>
        <div class="coin-list" id="adminList"></div>
        <p style="text-align:center;margin-top:30px;"><a href="index.html" style="color:#00d2ff;">← Quay lại trang công khai</a></p>
    </div>
    <script>
        const ADMIN_PASSWORD="duc123";
        const firebaseConfig={apiKey:"AIzaSyDKA8vVF_aSF-K6s5KYE_rvqfWczKcq58I",authDomain:"coin-tracker-eab72.firebaseapp.com",databaseURL:"https://coin-tracker-eab72-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"coin-tracker-eab72",storageBucket:"coin-tracker-eab72.firebasestorage.app",messagingSenderId:"901455627673",appId:"1:901455627673:web:d02f1a3495416a0cf87f08",measurementId:"G-KZS11T7QXV"};
        firebase.initializeApp(firebaseConfig);
        const coinsRef=firebase.database().ref('coins');
        const logsRef=firebase.database().ref('hitLogs');
        let allCoins=[],hitLogs=[],editingId=null,priceCache={},rangeCache={},alphaListCache=null,logFilter='today',coinFilter='all';

        function getWave(c){return c.wave||c.song||c.loaiSong||c.loai||c.type||c.category||c.waveType||'';}
        function hasNum(v){return v!==undefined&&v!==null&&v!==''&&!isNaN(Number(v));}
        function hasSL(c){return hasNum(c.sl);}
        function hasDCA(c){return hasNum(c.dca);}
        function ensureWaveOption(val){if(!val)return;const sel=document.getElementById('wave');if([...sel.options].some(o=>o.value===val))return;const opt=document.createElement('option');opt.value=val;opt.textContent=val;sel.appendChild(opt);}
        function isSameDay(ts){const d=new Date(ts),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
        function checkPassword(){if(document.getElementById('password').value===ADMIN_PASSWORD){document.getElementById('loginBox').style.display='none';document.getElementById('adminContent').style.display='block';updateAllPrices();}else document.getElementById('error').style.display='block';}
        function addLog(coin,side,kind){logsRef.push({coin,side,kind,time:new Date().toLocaleString('vi-VN'),timestamp:Date.now()});}
        function setLogFilter(type){logFilter=type;document.querySelectorAll('.hist-tabs button').forEach(b=>b.classList.remove('active'));if(event&&event.target)event.target.classList.add('active');renderLogs();}
        function setCoinFilter(type){coinFilter=type;document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));if(event&&event.target)event.target.classList.add('active');renderAdminList();}
        function renderLogs(){
            const box=document.getElementById('histList');if(!box)return;
            let rows=[...hitLogs];
            if(logFilter==='today')rows=rows.filter(x=>isSameDay(x.timestamp));
            if(logFilter==='tp')rows=rows.filter(x=>String(x.kind).indexOf('TP')===0);
            if(logFilter==='sl')rows=rows.filter(x=>x.kind==='SL');
            if(logFilter==='dca')rows=rows.filter(x=>x.kind==='DCA');
            if(!rows.length){box.innerHTML='<div class="hist-empty">'+(logFilter==='today'?'Hôm nay chưa có coin nào dính':'Chưa có lịch sử')+'</div>';return;}
            box.innerHTML=rows.map(x=>{const sl=x.kind==='SL',dca=x.kind==='DCA';return '<div class="hist-item '+(sl?'sl':(dca?'dca':''))+'"><div><span class="coin">'+x.coin+'</span> '+x.side+' — <span class="'+(sl?'kind-sl':(dca?'kind-dca':'kind-tp'))+'">dính '+x.kind+'</span></div><div class="when">'+(x.time||'')+'</div></div>';}).join('');
        }
        async function fetchCurrent(symbol){
            const urls=['https://api.binance.com/api/v3/ticker/price?symbol='+symbol+'USDT','https://fapi.binance.com/fapi/v1/ticker/price?symbol='+symbol+'USDT'];
            for(const url of urls){try{const res=await fetch(url);if(!res.ok)continue;const price=parseFloat((await res.json()).price);if(!isNaN(price))return price;}catch(e){}}
            try{if(!alphaListCache){const res=await fetch('https://www.binance.com/bapi/defi/v1/public/wallet-direct/buw/wallet/cex/alpha/all/token/list');if(res.ok)alphaListCache=(await res.json()).data||[];}if(alphaListCache){const item=alphaListCache.find(t=>(t.symbol||'').toUpperCase()===symbol);if(item){const price=parseFloat(item.price);if(!isNaN(price))return price;}}}catch(e){}
            try{const res=await fetch('https://api.dexscreener.com/latest/dex/search?q='+encodeURIComponent(symbol));if(res.ok){const pairs=((await res.json()).pairs||[]).filter(p=>p.baseToken&&p.baseToken.symbol&&p.baseToken.symbol.toUpperCase()===symbol);if(pairs.length){pairs.sort((a,b)=>(b.liquidity&&b.liquidity.usd?b.liquidity.usd:0)-(a.liquidity&&a.liquidity.usd?a.liquidity.usd:0));const price=parseFloat(pairs[0].priceUsd);if(!isNaN(price))return price;}}}catch(e){}
            return null;
        }
        async function fetchRangeSince(symbol,startTs){
            const start=startTs||Date.now();
            const urls=['https://api.binance.com/api/v3/klines?symbol='+symbol+'USDT&interval=5m&startTime='+start+'&limit=1000','https://fapi.binance.com/fapi/v1/klines?symbol='+symbol+'USDT&interval=5m&startTime='+start+'&limit=1000'];
            for(const url of urls){
                try{
                    const res=await fetch(url);if(!res.ok)continue;const arr=await res.json();
                    if(!Array.isArray(arr)||!arr.length)continue;
                    let high=-Infinity,low=Infinity;
                    arr.forEach(k=>{const h=parseFloat(k[2]),l=parseFloat(k[3]);if(!isNaN(h)&&h>high)high=h;if(!isNaN(l)&&l<low)low=l;});
                    if(high!==-Infinity)return {high,low};
                }catch(e){}
            }
            return null;
        }
        function applyFlags(c,price,high,low,canUnmark,updates){
            let tp1=false,tp2=false,tp3=false,sl=false,dca=false;
            if(c.side==='LONG'){
                tp1=high>=Number(c.tp1)||(price!=null&&price>=Number(c.tp1));
                tp2=high>=Number(c.tp2)||(price!=null&&price>=Number(c.tp2));
                tp3=high>=Number(c.tp3)||(price!=null&&price>=Number(c.tp3));
                sl=hasSL(c)&&(low<=Number(c.sl)||(price!=null&&price<=Number(c.sl)));
                dca=hasDCA(c)&&(low<=Number(c.dca)||(price!=null&&price<=Number(c.dca)));
            }else{
                tp1=low<=Number(c.tp1)||(price!=null&&price<=Number(c.tp1));
                tp2=low<=Number(c.tp2)||(price!=null&&price<=Number(c.tp2));
                tp3=low<=Number(c.tp3)||(price!=null&&price<=Number(c.tp3));
                sl=hasSL(c)&&(high>=Number(c.sl)||(price!=null&&price>=Number(c.sl)));
                dca=hasDCA(c)&&(high>=Number(c.dca)||(price!=null&&price>=Number(c.dca)));
            }
            const now=new Date().toLocaleString('vi-VN');
            function setFlag(field,kind,next){
                const prev=!!c[field];
                if(next&&!prev){updates[c.id+'/'+field]=true;updates[c.id+'/'+field+'Time']=now;addLog(c.coin,c.side,kind);}
                else if(!next&&prev&&canUnmark){updates[c.id+'/'+field]=false;}
            }
            setFlag('hitTP1','TP1',tp1);
            setFlag('hitTP2','TP2',tp2);
            setFlag('hitTP3','TP3',tp3);
            setFlag('hitSL','SL',sl);
            setFlag('hitDCA','DCA',dca);
        }
        async function updateAllPrices(){
            if(!allCoins.length)return;
            const loading=document.getElementById('loading');
            if(loading)loading.style.display='block';
            const unique=[...new Set(allCoins.map(c=>c.coin))];
            await Promise.all(unique.map(async s=>{priceCache[s]=await fetchCurrent(s);}));
            await Promise.all(allCoins.map(async c=>{rangeCache[c.id]=await fetchRangeSince(c.coin,c.timestamp||Date.now());}));
            const updates={};
            allCoins.forEach(c=>{
                const price=priceCache[c.coin];
                const range=rangeCache[c.id];
                if(range){
                    applyFlags(c,price,range.high,range.low,true,updates);
                }else if(price!=null){
                    applyFlags(c,price,price,price,false,updates);
                }
            });
            if(Object.keys(updates).length)coinsRef.update(updates);
            if(loading)loading.style.display='none';
            renderAdminList();
        }
        function forceHit(id,field,kind){
            const c=allCoins.find(x=>x.id===id);if(!c||c[field])return;
            const up={};up[field]=true;up[field+'Time']=new Date().toLocaleString('vi-VN');
            coinsRef.child(id).update(up).then(()=>addLog(c.coin,c.side,kind));
        }
        function clearForm(){['coin','entry','dca','sl','tp1','tp2','tp3','note'].forEach(id=>document.getElementById(id).value='');document.getElementById('side').value='LONG';document.getElementById('wave').value='';}
        function cancelEdit(){editingId=null;clearForm();document.getElementById('formTitle').textContent='📥 Thêm Nhận định';document.getElementById('saveBtn').textContent='+ Lưu nhận định';document.getElementById('cancelBtn').style.display='none';}
        function saveCoin(){
            const coin=document.getElementById('coin').value.trim().toUpperCase();
            const entry=parseFloat(document.getElementById('entry').value);
            const dcaRaw=document.getElementById('dca').value;
            const dca=dcaRaw===''?null:parseFloat(dcaRaw);
            const sl=parseFloat(document.getElementById('sl').value);
            const tp1=parseFloat(document.getElementById('tp1').value);
            const tp2=parseFloat(document.getElementById('tp2').value);
            const tp3=parseFloat(document.getElementById('tp3').value);
            const side=document.getElementById('side').value;
            const wave=document.getElementById('wave').value;
            const note=document.getElementById('note').value.trim();
            if(!coin||isNaN(entry)||isNaN(sl)||isNaN(tp1)||isNaN(tp2)||isNaN(tp3)){alert('Vui lòng nhập đầy đủ, gồm Stoploss!');return;}
            if(!wave){alert('Vui lòng chọn sóng!');return;}
            const payload={coin,entry,dca:(dcaRaw===''||isNaN(dca))?null:dca,sl,tp1,tp2,tp3,side,wave,note};
            if(editingId){coinsRef.child(editingId).update(payload).then(()=>{alert('✅ Đã sửa thành công!');cancelEdit();}).catch(err=>alert('Lỗi: '+err.message));}
            else{coinsRef.push(Object.assign(payload,{time:new Date().toLocaleString('vi-VN'),timestamp:Date.now(),hitTP1:false,hitTP2:false,hitTP3:false,hitSL:false,hitDCA:false})).then(()=>{alert('✅ Đã lưu nhận định thành công!');clearForm();}).catch(err=>alert('Lỗi: '+err.message));}
        }
        function editCoin(id){
            const c=allCoins.find(x=>x.id===id);if(!c)return;
            editingId=id;const wave=getWave(c);ensureWaveOption(wave);
            document.getElementById('coin').value=c.coin||'';
            document.getElementById('entry').value=c.entry||'';
            document.getElementById('dca').value=hasDCA(c)?c.dca:'';
            document.getElementById('sl').value=c.sl||'';
            document.getElementById('tp1').value=c.tp1||'';
            document.getElementById('tp2').value=c.tp2||'';
            document.getElementById('tp3').value=c.tp3||'';
            document.getElementById('side').value=c.side||'LONG';
            document.getElementById('wave').value=wave||'';
            document.getElementById('note').value=c.note||'';
            document.getElementById('formTitle').textContent='✏️ Sửa nhận định '+c.coin;
            document.getElementById('saveBtn').textContent='Lưu chỉnh sửa';
            document.getElementById('cancelBtn').style.display='block';
            window.scrollTo({top:0,behavior:'smooth'});
        }
        function deleteCoin(id,name){if(!confirm('Xóa nhận định '+name+' ?'))return;coinsRef.child(id).remove().then(()=>{if(editingId===id)cancelEdit();alert('Đã xóa '+name);}).catch(err=>alert('Lỗi: '+err.message));}
        function escapeHtml(text){return String(text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');}
        function renderAdminList(){
            const list=document.getElementById('adminList');if(!list)return;
            let filtered=[...allCoins];
            if(coinFilter==='tp1')filtered=filtered.filter(c=>c.hitTP1);
            if(coinFilter==='tp2')filtered=filtered.filter(c=>c.hitTP2);
            if(coinFilter==='tp3')filtered=filtered.filter(c=>c.hitTP3);
            if(coinFilter==='sl')filtered=filtered.filter(c=>c.hitSL);
            if(coinFilter==='dca')filtered=filtered.filter(c=>c.hitDCA);
            if(coinFilter==='pending')filtered=filtered.filter(c=>!c.hitTP1&&!c.hitTP2&&!c.hitTP3&&!c.hitSL&&!c.hitDCA);
            if(!filtered.length){list.innerHTML='<div class="empty">Không có lệnh trong bộ lọc này</div>';return;}
            let html='';
            filtered.forEach(c=>{
                const slText=hasSL(c)?'$'+Number(c.sl).toLocaleString(undefined,{maximumFractionDigits:6}):'--';
                const dcaText=hasDCA(c)?'$'+Number(c.dca).toLocaleString(undefined,{maximumFractionDigits:6}):'--';
                const sideClass=c.side==='LONG'?'side-long':'side-short';
                const wave=getWave(c);
                const price=priceCache[c.coin];
                const current=price!=null?'$'+Number(price).toLocaleString(undefined,{maximumFractionDigits:6}):'--';
                const cardClass=c.hitSL?'has-sl':((c.hitTP1||c.hitTP2||c.hitTP3)?'has-hit':'');
                html+='<div class="coin-card '+cardClass+'"><div class="card-header"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">';
                html+='<div class="coin-name">'+c.coin+'</div><span class="side-badge '+sideClass+'">'+c.side+'</span>';
                if(wave)html+='<span class="wave-badge">'+escapeHtml(wave)+'</span>';
                html+='</div><div class="time">'+(c.time||'')+'</div></div><div class="prices-grid">';
                html+='<div class="price-box"><div class="label">Vào lệnh</div><div class="value">$'+Number(c.entry).toLocaleString(undefined,{maximumFractionDigits:6})+'</div></div>';
                html+='<div class="price-box"><div class="label">DCA</div><div class="value dca-price">'+dcaText+'</div></div>';
                html+='<div class="price-box"><div class="label">Giá hiện tại</div><div class="value">'+current+'</div></div>';
                html+='<div class="price-box"><div class="label">Stoploss</div><div class="value sl-price">'+slText+'</div></div>';
                html+='<div class="price-box"><div class="label">TP1</div><div class="value">$'+Number(c.tp1).toLocaleString(undefined,{maximumFractionDigits:6})+'</div></div>';
                html+='<div class="price-box"><div class="label">TP2</div><div class="value">$'+Number(c.tp2).toLocaleString(undefined,{maximumFractionDigits:6})+'</div></div>';
                html+='<div class="price-box"><div class="label">TP3</div><div class="value">$'+Number(c.tp3).toLocaleString(undefined,{maximumFractionDigits:6})+'</div></div></div><div class="tp-status">';
                html+='<button class="tp-badge '+(c.hitTP1?'hit':'')+'" onclick="forceHit(\''+c.id+'\',\'hitTP1\',\'TP1\')">TP1 '+(c.hitTP1?'✓':'○')+'</button>';
                html+='<button class="tp-badge '+(c.hitTP2?'hit':'')+'" onclick="forceHit(\''+c.id+'\',\'hitTP2\',\'TP2\')">TP2 '+(c.hitTP2?'✓':'○')+'</button>';
                html+='<button class="tp-badge '+(c.hitTP3?'hit':'')+'" onclick="forceHit(\''+c.id+'\',\'hitTP3\',\'TP3\')">TP3 '+(c.hitTP3?'✓':'○')+'</button>';
                html+='<button class="tp-badge '+(c.hitSL?'sl-hit':'')+'" onclick="forceHit(\''+c.id+'\',\'hitSL\',\'SL\')">SL '+(c.hitSL?'✓':'○')+'</button>';
                html+='<button class="tp-badge '+(c.hitDCA?'dca-hit':'')+'" onclick="forceHit(\''+c.id+'\',\'hitDCA\',\'DCA\')">DCA '+(c.hitDCA?'✓':'○')+'</button></div>';
                if(c.note&&String(c.note).trim()!=='')html+='<div class="note-box"><div class="note-label">Note</div><div class="note-text">'+escapeHtml(c.note)+'</div></div>';
                html+='<div class="admin-actions"><button class="btn-edit" onclick="editCoin(\''+c.id+'\')">Sửa</button><button class="btn-del" onclick="deleteCoin(\''+c.id+'\',\''+c.coin+'\')">Xóa</button></div></div>';
            });
            list.innerHTML=html;
        }
        coinsRef.on('value',snap=>{const data=snap.val()||{};allCoins=Object.keys(data).map(k=>({id:k,...data[k]})).sort((a,b)=>b.timestamp-a.timestamp);allCoins.forEach(c=>ensureWaveOption(getWave(c)));renderAdminList();});
        logsRef.on('value',snap=>{const data=snap.val()||{};hitLogs=Object.keys(data).map(k=>({id:k,...data[k]})).sort((a,b)=>b.timestamp-a.timestamp);renderLogs();});
        setInterval(()=>{const box=document.getElementById('adminContent');if(box&&box.style.display!=='none')updateAllPrices();},30000);
    </script>
</body>
</html>
